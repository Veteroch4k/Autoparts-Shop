<div th:fragment="sidebar" id="layoutSidenav_nav" xmlns:sec="http://www.w3.org/1999/xhtml">
  <nav class="sb-sidenav accordion sb-sidenav-dark" id="sidenavAccordion">
    <div class="sb-sidenav-menu">
      <div class="nav">

        <div class="sb-sidenav-menu-heading">Меню</div>

        <th:block th:each="item : ${menuItems}">

          <th:block th:if="${not #lists.isEmpty(item.children)}">

            <a class="nav-link collapsed" href="#"
               data-bs-toggle="collapse"
               th:data-bs-target="'#collapse-' + ${item.id}"
               aria-expanded="false">

              <div class="sb-nav-link-icon">
                <i class="fas fa-folder"></i>
              </div>

              <span th:text="${item.title}">Название раздела</span>

              <div class="sb-sidenav-collapse-arrow">
                <i class="fas fa-angle-down"></i>
              </div>
            </a>

            <div class="collapse"
                 th:id="'collapse-' + ${item.id}"
                 data-bs-parent="#sidenavAccordion">
              <nav class="sb-sidenav-menu-nested nav">

                <a th:each="child : ${item.children}"
                   class="nav-link"
                   th:href="@{${child.urlPath}}"
                   th:text="${child.title}">
                  Ссылка на страницу
                </a>

              </nav>
            </div>
          </th:block>

          <th:block th:unless="${not #lists.isEmpty(item.children)}">
            <a class="nav-link" th:href="@{${item.urlPath}}">
              <div class="sb-nav-link-icon">
                <i class="fas fa-circle"></i>
              </div>
              <span th:text="${item.title}">Название ссылки</span>
            </a>
          </th:block>

        </th:block>
      </div>
    </div>

    <div class="sb-sidenav-footer">
      <div class="small">Пользователь:</div>
      <span sec:authentication="name">User</span>
    </div>
  </nav>
</div>
