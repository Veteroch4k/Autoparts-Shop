<!DOCTYPE html>
<html lang="ru" th:replace="~{layout :: layout(~{::content})}" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
  <div class="container-fluid px-4">
    <h1 class="mt-4">Пользователи</h1>
    <ol class="breadcrumb mb-4">
      <li class="breadcrumb-item"><a th:href="@{/}">Главная</a></li>
      <li class="breadcrumb-item active">Пользователи</li>
    </ol>

    <div class="card mb-4">
      <div class="card-header">
        <i class="fas fa-table me-1"></i>
        Список пользователей
      </div>
      <div class="card-body">
        <table id="datatablesSimple">
          <thead>
          <tr>
            <th>ID</th>
            <th>Логин</th>
            <th>Email</th>
            <th>Роль</th>
            <th>Активен</th>
            <th>Создан</th>
            <th>Действия</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="u : ${users}">
            <td th:text="${u.id}">1</td>
            <td th:text="${u.userName}">admin</td>
            <td th:text="${u.email}">admin@mail.com</td>
            <td th:text="${u.role}">DIRECTOR</td>
            <td th:text="${u.enabled}">true</td>
            <td th:text="${u.created_at}">2025-01-01T10:00</td>
            <td>
              <button type="button" class="btn btn-warning btn-sm"
                      th:if="${perms.canEdit}"
                      th:data-id="${u.id}"
                      th:data-username="${u.userName}"
                      th:data-email="${u.email}"
                      th:data-role="${u.role}"
                      th:data-enabled="${u.enabled}"
                      th:data-createdat="${u.created_at}"
                      onclick="fillForm(this)">
                <i class="fas fa-edit"></i>
              </button>

              <form th:action="@{/admin/users/delete/{id}(id=${u.id})}" method="post"
                    style="display:inline;"
                    th:if="${perms.canDelete}">
                <input type="hidden" name="_method" value="delete" />
                <button type="submit" class="btn btn-danger btn-sm"
                        onclick="return confirm('Удалить этого пользователя?');">
                  <i class="fas fa-trash"></i>
                </button>
              </form>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card mb-4" th:if="${perms.canWrite or perms.canEdit}">
      <div class="card-header">
        <i class="fas fa-edit me-1"></i>
        <span id="formTitle">Добавить нового пользователя</span>
      </div>
      <div class="card-body">
        <form th:action="@{/admin/users/save}" th:object="${user}" method="post" id="entityForm">
          <input type="hidden" th:field="*{id}" id="fieldId">

          <div class="row mb-3">
            <div class="row mb-3">
              <th:block th:replace="~{blocks/forms :: inputField('userName', 'Логин', 'text')}"></th:block>
              <th:block th:replace="~{blocks/forms :: inputField('email', 'Email', 'email')}"></th:block>
              <th:block th:replace="~{blocks/forms :: inputField('password', 'Пароль', 'password')}"></th:block>
            </div>
          </div>

          <div class="row mb-3">
            <div class="col-md-4">
              <label for="fieldRole" class="form-label">Роль</label>
              <select class="form-select" id="fieldRole" name="role" th:field="*{role}">
                <option value="" selected>—</option>
                <option value="DIRECTOR">DIRECTOR</option>
                <option value="MANAGER">HR_MANAGER</option>
                <option value="EMPLOYEE">EMPLOYEE</option>
              </select>
            </div>

            <div class="col-md-4">
              <label for="fieldEnabled" class="form-label">Активен</label>
              <select class="form-select" id="fieldEnabled" name="enabled" th:field="*{enabled}">
                <option value="true">true</option>
                <option value="false">false</option>
              </select>
            </div>

            <div class="col-md-4">
              <label for="fieldCreatedAt" class="form-label">Создан</label>
              <input type="datetime-local" class="form-control" id="fieldCreatedAt" name="created_at" th:field="*{created_at}">
            </div>
          </div>

          <div class="mt-4 mb-0">
            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
              <button type="button" class="btn btn-secondary me-md-2" onclick="clearForm()">Очистить / Отмена</button>
              <button type="submit" class="btn btn-primary" id="submitBtn">Сохранить</button>
            </div>
          </div>
        </form>
      </div>
    </div>

  </div>

  <script>
    function setVal(ids, value) {
      for (let i = 0; i < ids.length; i++) {
        let el = document.getElementById(ids[i]);
        if (el) { el.value = value; return; }
      }
    }

    function fillForm(button) {
      let id = button.getAttribute('data-id');
      let username = button.getAttribute('data-username');
      let email = button.getAttribute('data-email');
      let role = button.getAttribute('data-role');
      let enabled = button.getAttribute('data-enabled');
      let createdAt = button.getAttribute('data-createdat');

      setVal(['fieldId'], id);
      setVal(['fieldUserName'], username);
      setVal(['fieldEmail'], email);
      setVal(['fieldRole'], role);
      setVal(['fieldEnabled'], enabled === 'true' ? 'true' : 'false');

      if (createdAt) {
        let v = createdAt.replace(' ', 'T');
        if (v.length >= 16) v = v.substring(0, 16);
        setVal(['fieldCreatedAt'], v);
      } else {
        setVal(['fieldCreatedAt'], '');
      }

      document.getElementById('formTitle').innerText = 'Редактирование пользователя (ID: ' + id + ')';
      document.getElementById('submitBtn').innerText = 'Обновить';
      document.getElementById('submitBtn').classList.remove('btn-primary');
      document.getElementById('submitBtn').classList.add('btn-success');

      document.getElementById('entityForm').scrollIntoView({ behavior: 'smooth' });
    }

    function clearForm() {
      setVal(['fieldId'], '');
      setVal(['fieldUserName'], '');
      setVal(['fieldEmail'], '');
      setVal(['fieldPassword'], '');
      setVal(['fieldRole'], '');
      setVal(['fieldEnabled'], 'true');
      setVal(['fieldCreatedAt'], '');

      document.getElementById('formTitle').innerText = 'Добавить нового пользователя';
      document.getElementById('submitBtn').innerText = 'Сохранить';
      document.getElementById('submitBtn').classList.add('btn-primary');
      document.getElementById('submitBtn').classList.remove('btn-success');
    }
  </script>
</div>
</body>
</html>
