<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<div th:replace ="~{blocks/head :: head(title = 'Регистрация')}"></div>

<body class="bg-primary">
<div id="layoutAuthentication">
    <div id="layoutAuthentication_content">
        <main>
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-7">
                        <div class="card shadow-lg border-0 rounded-lg mt-5">
                            <div class="card-header"><h3 class="text-center font-weight-light my-4">Регистрация</h3></div>
                            <div class="card-body">

                                <form th:action="@{/auth/register}" th:object="${user}" method="post">

                                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                                    <div class="form-floating mb-3">
                                        <input class="form-control"
                                               id="inputLogin"
                                               th:field="*{userName}"
                                               type="text"
                                               placeholder="Login" required />
                                        <label for="inputLogin">Логин</label>
                                    </div>

                                    <div class="form-floating mb-3">
                                        <input class="form-control"
                                               id="inputEmail"
                                               th:field="*{email}"
                                               type="email"
                                               placeholder="name@example.com" required />
                                        <label for="inputEmail">Email</label>
                                    </div>

                                    <div class="form-floating mb-3">
                                        <input class="form-control"
                                               id="inputPassword"
                                               th:field="*{password}"
                                               type="password"
                                               placeholder="Password" required />
                                        <label for="inputPassword">Пароль</label>
                                    </div>

                                    <div class="mt-4 mb-0">
                                        <div class="d-grid">
                                            <button type="submit" class="btn btn-primary btn-block">Зарегистрироваться</button>
                                        </div>
                                    </div>
                                </form>

                            </div>
                            <div class="card-footer text-center py-3">
                                <div class="small"><a th:href="@{/auth/login}">Есть аккаунт? Войти</a></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script th:src="@{/js/scripts.js}"></script>
</body>
</html>
