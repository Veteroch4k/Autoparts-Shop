<!DOCTYPE html>
<html lang="ru" th:replace="~{layout :: layout(~{::content})}" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
  <div class="container-fluid px-4">
    <h1 class="mt-4">Возвраты</h1>
    <ol class="breadcrumb mb-4">
      <li class="breadcrumb-item"><a th:href="@{/}">Главная</a></li>
      <li class="breadcrumb-item active">Возвраты</li>
    </ol>

    <div class="card mb-4">
      <div class="card-header">
        <i class="fas fa-table me-1"></i>
        Список возвратов
      </div>
      <div class="card-body">
        <table id="datatablesSimple">
          <thead>
          <tr>
            <th>ID</th>
            <th>Товар</th>
            <th>Количество</th>
            <th>Поставщик</th>
            <th>Сумма возврата</th>
            <th>Дата возврата</th>
            <th>Действия</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="defective : ${defectives}">
            <td th:text="${defective.id}">1</td>
            <td th:text="${defective.product != null ? defective.product.name : ''}">Товар</td>
            <td th:text="${defective.productQuantity}">1</td>
            <td th:text="${defective.supplier != null ? defective.supplier.name : ''}">Поставщик</td>
            <td th:text="${defective.refundAmount}">100.00</td>
            <td th:text="${defective.returnDate}">2025-01-01</td>
            <td>
              <button type="button" class="btn btn-warning btn-sm"
                      th:if="${perms.canEdit}"
                      th:data-id="${defective.id}"
                      th:data-productid="${defective.product != null ? defective.product.id : ''}"
                      th:data-quantity="${defective.productQuantity}"
                      th:data-supplierid="${defective.supplier != null ? defective.supplier.id : ''}"
                      th:data-refundamount="${defective.refundAmount}"
                      onclick="fillForm(this)">
                <i class="fas fa-edit"></i>
              </button>

              <form th:action="@{/trade/defective/delete/{id}(id=${defective.id})}" method="post"
                    style="display:inline;"
                    th:if="${perms.canDelete}">
                <input type="hidden" name="_method" value="delete" />
                <button type="submit" class="btn btn-danger btn-sm"
                        onclick="return confirm('Удалить этот возврат?');">
                  <i class="fas fa-trash"></i>
                </button>
              </form>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card mb-4" th:if="${perms.canWrite or perms.canEdit}">
      <div class="card-header">
        <i class="fas fa-edit me-1"></i>
        <span id="formTitle">Добавить новый возврат</span>
      </div>
      <div class="card-body">
        <form th:action="@{/trade/defective/save}" th:object="${defectiveProduct}" method="post" id="entityForm">
          <input type="hidden" th:field="*{id}" id="fieldId">

          <div class="row mb-3">
            <div class="row mb-3">
              <th:block th:replace="~{blocks/forms :: inputField('product.id', 'Товар (ID)', 'number')}"></th:block>
              <th:block th:replace="~{blocks/forms :: inputField('productQuantity', 'Количество', 'number')}"></th:block>
              <th:block th:replace="~{blocks/forms :: inputField('supplier.id', 'Поставщик (ID)', 'number')}"></th:block>
              <th:block th:replace="~{blocks/forms :: inputField('refundAmount', 'Сумма возврата', 'number')}"></th:block>
            </div>
          </div>

          <div class="mt-4 mb-0">
            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
              <button type="button" class="btn btn-secondary me-md-2" onclick="clearForm()">Очистить / Отмена</button>
              <button type="submit" class="btn btn-primary" id="submitBtn">Сохранить</button>
            </div>
          </div>
        </form>
      </div>
    </div>

  </div>

  <script>
    function setVal(ids, value) {
      for (let i = 0; i < ids.length; i++) {
        let el = document.getElementById(ids[i]);
        if (el) { el.value = value; return; }
      }
    }

    function fillForm(button) {
      let id = button.getAttribute('data-id');
      let productId = button.getAttribute('data-productid');
      let quantity = button.getAttribute('data-quantity');
      let supplierId = button.getAttribute('data-supplierid');
      let refundAmount = button.getAttribute('data-refundamount');

      setVal(['fieldId'], id);
      setVal(['fieldProductId', 'fieldProduct.id', 'fieldProduct'], productId);
      setVal(['fieldProductQuantity'], quantity);
      setVal(['fieldSupplierId', 'fieldSupplier.id', 'fieldSupplier'], supplierId);
      setVal(['fieldRefundAmount'], refundAmount);

      document.getElementById('formTitle').innerText = 'Редактирование возврата (ID: ' + id + ')';
      document.getElementById('submitBtn').innerText = 'Обновить';
      document.getElementById('submitBtn').classList.remove('btn-primary');
      document.getElementById('submitBtn').classList.add('btn-success');

      document.getElementById('entityForm').scrollIntoView({ behavior: 'smooth' });
    }

    function clearForm() {
      setVal(['fieldId'], '');
      setVal(['fieldProductId', 'fieldProduct.id', 'fieldProduct'], '');
      setVal(['fieldProductQuantity'], '');
      setVal(['fieldSupplierId', 'fieldSupplier.id', 'fieldSupplier'], '');
      setVal(['fieldRefundAmount'], '');

      document.getElementById('formTitle').innerText = 'Добавить новый возврат';
      document.getElementById('submitBtn').innerText = 'Сохранить';
      document.getElementById('submitBtn').classList.add('btn-primary');
      document.getElementById('submitBtn').classList.remove('btn-success');
    }
  </script>
</div>
</body>
</html>
