<!DOCTYPE html>
<html lang="ru" th:replace="~{layout :: layout(~{::content})}" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
  <div class="container-fluid px-4">
    <h1 class="mt-4">Рабочие места</h1>
    <ol class="breadcrumb mb-4">
      <li class="breadcrumb-item"><a th:href="@{/static}">Главная</a></li>
      <li class="breadcrumb-item active">Рабочие места</li>
    </ol>

    <div class="card mb-4">
      <div class="card-header">
        <i class="fas fa-table me-1"></i>
        Список рабочих мест
      </div>
      <div class="card-body">
        <table id="datatablesSimple">
          <thead>
          <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Действия</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="workPlace : ${workPlaces}">
            <td th:text="${workPlace.id}">1</td>
            <td th:text="${workPlace.name}">Рабочее место</td>
            <td>
              <button type="button" class="btn btn-warning btn-sm"
                      th:if="${perms.canEdit}"
                      th:data-id="${workPlace.id}"
                      th:data-name="${workPlace.name}"
                      onclick="fillForm(this)">
                <i class="fas fa-edit"></i>
              </button>

              <form th:action="@{/ref/workplaces/delete/{id}(id=${workPlace.id})}" method="post"
                    style="display:inline;"
                    th:if="${perms.canDelete}">
                <input type="hidden" name="_method" value="delete" />
                <button type="submit" class="btn btn-danger btn-sm"
                        onclick="return confirm('Удалить это рабочее место?');">
                  <i class="fas fa-trash"></i>
                </button>
              </form>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card mb-4" th:if="${perms.canWrite or perms.canEdit}">
      <div class="card-header">
        <i class="fas fa-edit me-1"></i>
        <span id="formTitle">Добавить новое рабочее место</span>
      </div>
      <div class="card-body">
        <form th:action="@{/ref/workplaces/save}" th:object="${workPlace}" method="post" id="entityForm">
          <input type="hidden" th:field="*{id}" id="fieldId">

          <div class="row mb-3">
            <div class="row mb-3">
              <th:block th:replace="~{blocks/forms :: inputField('name', 'Название', 'text')}"></th:block>
            </div>
          </div>

          <div class="mt-4 mb-0">
            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
              <button type="button" class="btn btn-secondary me-md-2" onclick="clearForm()">Очистить / Отмена</button>
              <button type="submit" class="btn btn-primary" id="submitBtn">Сохранить</button>
            </div>
          </div>
        </form>
      </div>
    </div>

  </div>

  <script>
    function setVal(ids, value) {
      for (let i = 0; i < ids.length; i++) {
        let el = document.getElementById(ids[i]);
        if (el) { el.value = value; return; }
      }
    }

    function fillForm(button) {
      let id = button.getAttribute('data-id');
      let name = button.getAttribute('data-name');

      setVal(['fieldId'], id);
      setVal(['fieldName'], name);

      document.getElementById('formTitle').innerText = 'Редактирование рабочего места (ID: ' + id + ')';
      document.getElementById('submitBtn').innerText = 'Обновить';
      document.getElementById('submitBtn').classList.remove('btn-primary');
      document.getElementById('submitBtn').classList.add('btn-success');

      document.getElementById('entityForm').scrollIntoView({ behavior: 'smooth' });
    }

    function clearForm() {
      setVal(['fieldId'], '');
      setVal(['fieldName'], '');

      document.getElementById('formTitle').innerText = 'Добавить новое рабочее место';
      document.getElementById('submitBtn').innerText = 'Сохранить';
      document.getElementById('submitBtn').classList.add('btn-primary');
      document.getElementById('submitBtn').classList.remove('btn-success');
    }
  </script>
</div>
</body>
</html>
