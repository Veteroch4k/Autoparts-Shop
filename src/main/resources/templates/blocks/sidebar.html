<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<div th:fragment="sidebar" id="layoutSidenav_nav">
  <nav class="sb-sidenav accordion sb-sidenav-dark" id="sidenavAccordion">
    <div class="sb-sidenav-menu">
      <div class="nav">

        <div class="sb-sidenav-menu-heading">Главное</div>
        <a class="nav-link" th:href="@{/}">
          <div class="sb-nav-link-icon"><i class="fas fa-tachometer-alt"></i></div>
          Дашборд
        </a>

        <div sec:authorize="hasRole('ADMIN')">
          <div class="sb-sidenav-menu-heading">Администрирование</div>

          <a class="nav-link" th:href="@{/users}">
            <div class="sb-nav-link-icon"><i class="fas fa-users-cog"></i></div>
            Пользователи
          </a>

          <a class="nav-link collapsed" href="#" data-bs-toggle="collapse" data-bs-target="#collapseDictionaries">
            <div class="sb-nav-link-icon"><i class="fas fa-book"></i></div>
            Справочники
            <div class="sb-sidenav-collapse-arrow"><i class="fas fa-angle-down"></i></div>
          </a>
          <div class="collapse" id="collapseDictionaries">
            <nav class="sb-sidenav-menu-nested nav">
              <a class="nav-link" th:href="@{/dict/cities}">Города</a>
              <a class="nav-link" th:href="@{/dict/positions}">Должности</a>
            </nav>
          </div>
        </div>

        <div sec:authorize="hasAnyRole('ADMIN', 'MANAGER')">
          <div class="sb-sidenav-menu-heading">Работа</div>

          <a class="nav-link" th:href="@{/employees}">
            <div class="sb-nav-link-icon"><i class="fas fa-user-tie"></i></div>
            Сотрудники
          </a>

          <a class="nav-link" th:href="@{/orders}">
            <div class="sb-nav-link-icon"><i class="fas fa-file-contract"></i></div>
            Приказы
          </a>
        </div>

        <a class="nav-link collapsed" href="#" data-bs-toggle="collapse" data-bs-target="#collapseDocs">
          <div class="sb-nav-link-icon"><i class="fas fa-file-alt"></i></div>
          Документы
          <div class="sb-sidenav-collapse-arrow"><i class="fas fa-angle-down"></i></div>
        </a>
        <div class="collapse" id="collapseDocs">
          <nav class="sb-sidenav-menu-nested nav">
            <a class="nav-link" th:href="@{/docs/general}">Общий отчет</a>

            <a class="nav-link" th:href="@{/docs/financial}"
               sec:authorize="hasRole('DIRECTOR')">
              Финансовый отчет
            </a>
          </nav>
        </div>

      </div>
    </div>

    <div class="sb-sidenav-footer">
      <div class="small">Пользователь:</div>
      <span sec:authentication="name">User</span>
      (<span sec:authentication="principal.authorities">Roles</span>)
    </div>
  </nav>
</div>
