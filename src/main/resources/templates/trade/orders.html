<!DOCTYPE html>
<html lang="ru" th:replace="~{layout :: layout(~{::content})}" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
  <div class="container-fluid px-4">
    <h1 class="mt-4">Заказы клиентов</h1>
    <ol class="breadcrumb mb-4">
      <li class="breadcrumb-item"><a th:href="@{/}">Главная</a></li>
      <li class="breadcrumb-item active">Заказы клиентов</li>
    </ol>

    <div class="card mb-4">
      <div class="card-header">
        <i class="fas fa-table me-1"></i>
        Список заказов
      </div>
      <div class="card-body">
        <table id="datatablesSimple">
          <thead>
          <tr>
            <th>ID</th>
            <th>Товар</th>
            <th>Количество</th>
            <th>Клиент</th>
            <th>Дата заказа</th>
            <th>Цена заказа</th>
            <th>Действия</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="order : ${orders}">
            <td th:text="${order.id}">1</td>
            <td th:text="${order.product != null ? order.product.name : ''}">Товар</td>
            <td th:text="${order.quantity}">1</td>
            <td th:text="${order.client != null ? (order.client.firstName + ' ' + order.client.secondName) : ''}">Клиент</td>
            <td th:text="${order.orderDate}">2025-01-01</td>
            <td th:text="${order.orderPrice}">100.00</td>
            <td>
              <button type="button" class="btn btn-warning btn-sm"
                      th:if="${perms.canEdit}"
                      th:data-id="${order.id}"
                      th:data-productid="${order.product != null ? order.product.id : ''}"
                      th:data-quantity="${order.quantity}"
                      th:data-clientid="${order.client != null ? order.client.id : ''}"
                      th:data-orderprice="${order.orderPrice}"
                      onclick="fillForm(this)">
                <i class="fas fa-edit"></i>
              </button>

              <form th:action="@{/trade/orders/delete/{id}(id=${order.id})}" method="post"
                    style="display:inline;"
                    th:if="${perms.canDelete}">
                <input type="hidden" name="_method" value="delete" />
                <button type="submit" class="btn btn-danger btn-sm"
                        onclick="return confirm('Удалить этот заказ?');">
                  <i class="fas fa-trash"></i>
                </button>
              </form>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card mb-4" th:if="${perms.canWrite or perms.canEdit}">
      <div class="card-header">
        <i class="fas fa-edit me-1"></i>
        <span id="formTitle">Добавить новый заказ</span>
      </div>
      <div class="card-body">
        <form th:action="@{/trade/orders/save}" th:object="${order}" method="post" id="entityForm">
          <input type="hidden" th:field="*{id}" id="fieldId">

          <div class="row mb-3">
            <div class="row mb-3">
              <th:block th:replace="~{blocks/forms :: inputField('product.id', 'Товар (ID)', 'number')}"></th:block>
              <th:block th:replace="~{blocks/forms :: inputField('quantity', 'Количество', 'number')}"></th:block>
              <th:block th:replace="~{blocks/forms :: inputField('client.id', 'Клиент (ID)', 'number')}"></th:block>
              <th:block th:replace="~{blocks/forms :: inputField('orderPrice', 'Цена заказа', 'number')}"></th:block>
            </div>
          </div>

          <div class="mt-4 mb-0">
            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
              <button type="button" class="btn btn-secondary me-md-2" onclick="clearForm()">Очистить / Отмена</button>
              <button type="submit" class="btn btn-primary" id="submitBtn">Сохранить</button>
            </div>
          </div>
        </form>
      </div>
    </div>

  </div>

  <script>
    function setVal(ids, value) {
      for (let i = 0; i < ids.length; i++) {
        let el = document.getElementById(ids[i]);
        if (el) { el.value = value; return; }
      }
    }

    function fillForm(button) {
      let id = button.getAttribute('data-id');
      let productId = button.getAttribute('data-productid');
      let quantity = button.getAttribute('data-quantity');
      let clientId = button.getAttribute('data-clientid');
      let orderPrice = button.getAttribute('data-orderprice');

      setVal(['fieldId'], id);
      setVal(['fieldProductId', 'fieldProduct.id', 'fieldProduct'], productId);
      setVal(['fieldQuantity'], quantity);
      setVal(['fieldClientId', 'fieldClient.id', 'fieldClient'], clientId);
      setVal(['fieldOrderPrice'], orderPrice);

      document.getElementById('formTitle').innerText = 'Редактирование заказа (ID: ' + id + ')';
      document.getElementById('submitBtn').innerText = 'Обновить';
      document.getElementById('submitBtn').classList.remove('btn-primary');
      document.getElementById('submitBtn').classList.add('btn-success');

      document.getElementById('entityForm').scrollIntoView({ behavior: 'smooth' });
    }

    function clearForm() {
      setVal(['fieldId'], '');
      setVal(['fieldProductId', 'fieldProduct.id', 'fieldProduct'], '');
      setVal(['fieldQuantity'], '');
      setVal(['fieldClientId', 'fieldClient.id', 'fieldClient'], '');
      setVal(['fieldOrderPrice'], '');

      document.getElementById('formTitle').innerText = 'Добавить новый заказ';
      document.getElementById('submitBtn').innerText = 'Сохранить';
      document.getElementById('submitBtn').classList.add('btn-primary');
      document.getElementById('submitBtn').classList.remove('btn-success');
    }
  </script>
</div>
</body>
</html>
