<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<div th:replace ="~{blocks/head :: head(title = 'Новый пароль')}"></div>

<body class="bg-primary">
<div id="layoutAuthentication">
  <div id="layoutAuthentication_content">
    <main>
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-5">
            <div class="card shadow-lg border-0 rounded-lg mt-5">
              <div class="card-header"><h3 class="text-center font-weight-light my-4">Смена пароля</h3></div>
              <div class="card-body">
                <div class="small mb-3 text-muted">Email подтвержден. Придумайте новый пароль.</div>

                <form th:action="@{/auth/reset-password}" method="post">

                  <div class="form-floating mb-3">
                    <input class="form-control"
                           id="inputPassword"
                           name="password"
                           type="password"
                           placeholder="Новый пароль" required />
                    <label for="inputPassword">Новый пароль</label>
                  </div>

                  <div class="d-flex align-items-center justify-content-between mt-4 mb-0">
                    <button type="submit" class="btn btn-primary w-100">Сохранить новый пароль</button>
                  </div>
                </form>

              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script th:src="@{/js/scripts.js}"></script>
</body>
</html>
