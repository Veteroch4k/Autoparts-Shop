<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<div th:replace ="~{blocks/head :: head(title = 'Авторизация')}"></div>

<body class="bg-primary">
<div id="layoutAuthentication">
    <div id="layoutAuthentication_content">
        <main>
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-5">
                        <div class="card shadow-lg border-0 rounded-lg mt-5">
                            <div class="card-header"><h3 class="text-center font-weight-light my-4">Авторизация</h3></div>
                            <div class="card-body">

                                <form th:action="@{/perform-login}" method="post">

                                    <div th:if="${param.error}" class="alert alert-danger" role="alert">
                                        Неверный логин или пароль!
                                    </div>
                                    <div th:if="${param.logout}" class="alert alert-success" role="alert">
                                        Вы успешно вышли из системы.
                                    </div>

                                    <div class="form-floating mb-3">
                                        <input class="form-control"
                                               id="inputLogin"
                                               name="username"
                                               type="text"
                                               placeholder="Введите логин" required />
                                        <label for="inputLogin">Логин</label>
                                    </div>

                                    <div class="form-floating mb-3">
                                        <input class="form-control"
                                               id="inputPassword"
                                               name="password"
                                               type="password"
                                               placeholder="Password" required />
                                        <label for="inputPassword">Пароль</label>
                                    </div>

                                    <div class="d-flex align-items-center justify-content-between mt-4 mb-0">
                                        <a class="small" th:href="@{/auth/forgot-password}">Забыли пароль?</a>

                                        <button type="submit" class="btn btn-primary">Войти</button>
                                    </div>
                                </form>

                            </div>
                            <div class="card-footer text-center py-3">
                                <div class="small"><a th:href="@{/auth/register}">Нет аккаунта? Зарегистрироваться!</a></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div id="layoutAuthentication_footer">
        <footer class="py-4 bg-light mt-auto">
            <div class="container-fluid px-4">
                <div class="d-flex align-items-center justify-content-between small">
                    <div class="text-muted">Copyright &copy; Veteroch4k 2025</div>
                    <div>
                        <a href="#">Privacy Policy</a>
                        &middot;
                        <a href="#">Terms &amp; Conditions</a>
                    </div>
                </div>
            </div>
        </footer>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script th:src="@{/js/scripts.js}"></script>
</body>
</html>
