<!DOCTYPE html>
<html lang="ru" th:replace="~{layout :: layout(~{::content})}" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
  <div class="container-fluid px-4">
    <h1 class="mt-4">Инвентаризация</h1>
    <ol class="breadcrumb mb-4">
      <li class="breadcrumb-item"><a th:href="@{/}">Главная</a></li>
      <li class="breadcrumb-item active">Инвентаризация</li>
    </ol>

    <div class="card mb-4">
      <div class="card-header">
        <i class="fas fa-table me-1"></i>
        Инвентаризация по ячейкам
      </div>
      <div class="card-body">
        <table id="datatablesSimple">
          <thead>
          <tr>
            <th>ID</th>
            <th>Товар</th>
            <th>Ячейка</th>
            <th>Количество</th>
            <th>Действия</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="inv : ${inventory}">
            <td th:text="${inv.id}">1</td>
            <td th:text="${inv.product != null ? inv.product.name : ''}">Товар</td>
            <td th:text="${inv.storageCell != null ? inv.storageCell.cellNumber : ''}">A1</td>
            <td th:text="${inv.productQuantity}">1</td>
            <td>
              <button type="button" class="btn btn-warning btn-sm"
                      th:if="${perms.canEdit}"
                      th:data-id="${inv.id}"
                      th:data-productid="${inv.product != null ? inv.product.id : ''}"
                      th:data-storagecellid="${inv.storageCell != null ? inv.storageCell.id : ''}"
                      th:data-quantity="${inv.productQuantity}"
                      onclick="fillForm(this)">
                <i class="fas fa-edit"></i>
              </button>

              <form th:action="@{/store/inventory/delete/{id}(id=${inv.id})}" method="post"
                    style="display:inline;"
                    th:if="${perms.canDelete}">
                <input type="hidden" name="_method" value="delete" />
                <button type="submit" class="btn btn-danger btn-sm"
                        onclick="return confirm('Удалить запись инвентаризации?');">
                  <i class="fas fa-trash"></i>
                </button>
              </form>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card mb-4" th:if="${perms.canWrite or perms.canEdit}">
      <div class="card-header">
        <i class="fas fa-edit me-1"></i>
        <span id="formTitle">Добавить запись инвентаризации</span>
      </div>
      <div class="card-body">
        <form th:action="@{/store/inventory/save}" th:object="${cellInventory}" method="post" id="entityForm">
          <input type="hidden" th:field="*{id}" id="fieldId">

          <div class="row mb-3">
            <div class="row mb-3">
              <th:block th:replace="~{blocks/forms :: inputField('product.id', 'Товар (ID)', 'number')}"></th:block>
              <th:block th:replace="~{blocks/forms :: inputField('storageCell.id', 'Ячейка (ID)', 'number')}"></th:block>
              <th:block th:replace="~{blocks/forms :: inputField('productQuantity', 'Количество', 'number')}"></th:block>
            </div>
          </div>

          <div class="mt-4 mb-0">
            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
              <button type="button" class="btn btn-secondary me-md-2" onclick="clearForm()">Очистить / Отмена</button>
              <button type="submit" class="btn btn-primary" id="submitBtn">Сохранить</button>
            </div>
          </div>
        </form>
      </div>
    </div>

  </div>

  <script>
    function setVal(ids, value) {
      for (let i = 0; i < ids.length; i++) {
        let el = document.getElementById(ids[i]);
        if (el) { el.value = value; return; }
      }
    }

    function fillForm(button) {
      let id = button.getAttribute('data-id');
      let productId = button.getAttribute('data-productid');
      let storageCellId = button.getAttribute('data-storagecellid');
      let quantity = button.getAttribute('data-quantity');

      setVal(['fieldId'], id);
      setVal(['fieldProductId', 'fieldProduct.id', 'fieldProduct'], productId);
      setVal(['fieldStorageCellId', 'fieldStorageCell.id', 'fieldStorageCell'], storageCellId);
      setVal(['fieldProductQuantity'], quantity);

      document.getElementById('formTitle').innerText = 'Редактирование инвентаризации (ID: ' + id + ')';
      document.getElementById('submitBtn').innerText = 'Обновить';
      document.getElementById('submitBtn').classList.remove('btn-primary');
      document.getElementById('submitBtn').classList.add('btn-success');

      document.getElementById('entityForm').scrollIntoView({ behavior: 'smooth' });
    }

    function clearForm() {
      setVal(['fieldId'], '');
      setVal(['fieldProductId', 'fieldProduct.id', 'fieldProduct'], '');
      setVal(['fieldStorageCellId', 'fieldStorageCell.id', 'fieldStorageCell'], '');
      setVal(['fieldProductQuantity'], '');

      document.getElementById('formTitle').innerText = 'Добавить запись инвентаризации';
      document.getElementById('submitBtn').innerText = 'Сохранить';
      document.getElementById('submitBtn').classList.add('btn-primary');
      document.getElementById('submitBtn').classList.remove('btn-success');
    }
  </script>
</div>
</body>
</html>
