<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<div th:replace ="~{blocks/head :: head(title = 'Восстановление пароля')}"></div>

<body class="bg-primary">
<div id="layoutAuthentication">
    <div id="layoutAuthentication_content">
        <main>
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-5">
                        <div class="card shadow-lg border-0 rounded-lg mt-5">
                            <div class="card-header"><h3 class="text-center font-weight-light my-4">Восстановление пароля</h3></div>
                            <div class="card-body">
                                <div class="small mb-3 text-muted">Введите ваш email (или логин), и мы отправим инструкции по сбросу пароля.</div>

                                <form th:action="@{/auth/forgot-password}" method="post">

                                    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}">
                                        Ошибка: Email не найден
                                    </div>

                                    <div class="form-floating mb-3">
                                        <input class="form-control"
                                               id="inputEmail"
                                               name="email"
                                               type="email"
                                               placeholder="name@example.com" required />
                                        <label for="inputEmail">Email адрес</label>
                                    </div>

                                    <div class="d-flex align-items-center justify-content-between mt-4 mb-0">
                                        <a class="small" th:href="@{/auth/login}">Вернуться ко входу</a>
                                        <button type="submit" class="btn btn-primary">Сбросить пароль</button>
                                    </div>
                                </form>
                            </div>
                            <div class="card-footer text-center py-3">
                                <div class="small"><a th:href="@{/auth/register}">Нужен аккаунт? Регистрация!</a></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div id="layoutAuthentication_footer">
        <footer class="py-4 bg-light mt-auto">
            <div class="container-fluid px-4">
                <div class="d-flex align-items-center justify-content-between small">
                    <div class="text-muted">Copyright &copy; Veteroch4k 2025</div>
                    <div>
                        <a href="#">Privacy Policy</a>
                        &middot;
                        <a href="#">Terms &amp; Conditions</a>
                    </div>
                </div>
            </div>
        </footer>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script th:src="@{/js/scripts.js}"></script>
</body>
</html>
