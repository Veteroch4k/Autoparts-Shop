<!DOCTYPE html>
<html lang="ru" th:replace="~{layout :: layout(~{::content})}" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
  <div class="container-fluid px-4">
    <h1 class="mt-4">Поставщики товаров</h1>
    <ol class="breadcrumb mb-4">
      <li class="breadcrumb-item"><a th:href="@{/}">Главная</a></li>
      <li class="breadcrumb-item active">Поставщики товаров</li>
    </ol>

    <div class="card mb-4">
      <div class="card-header">
        <i class="fas fa-table me-1"></i>
        Список связей товар–поставщик
      </div>
      <div class="card-body">
        <table id="datatablesSimple">
          <thead>
          <tr>
            <th>Товар</th>
            <th>Поставщик</th>
            <th>Дни доставки</th>
            <th>Действия</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="ps : ${productSuppliers}">
            <td th:text="${ps.product != null ? ps.product.name : (ps.id != null ? ps.id.productId : '')}">Товар</td>
            <td th:text="${ps.supplier != null ? ps.supplier.name : (ps.id != null ? ps.id.supplierId : '')}">Поставщик</td>
            <td th:text="${ps.deliveryDays}">3</td>
            <td>
              <button type="button" class="btn btn-warning btn-sm"
                      th:if="${perms.canEdit}"
                      th:data-productid="${ps.id != null ? ps.id.productId : ''}"
                      th:data-supplierid="${ps.id != null ? ps.id.supplierId : ''}"
                      th:data-deliverydays="${ps.deliveryDays}"
                      onclick="fillForm(this)">
                <i class="fas fa-edit"></i>
              </button>

              <form th:if="${perms.canDelete}"
                    th:action="@{/supply/psuppliers/delete/{pId}/{sId}(pId=${ps.id?.productId}, sId=${ps.id?.supplierId})}"
                    method="post"
                    style="display:inline;">
                <input type="hidden" name="_method" value="delete" />
                <button type="submit" class="btn btn-danger btn-sm"
                        onclick="return confirm('Удалить эту связь?');">
                  <i class="fas fa-trash"></i>
                </button>
              </form>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card mb-4" th:if="${perms.canWrite or perms.canEdit}">
      <div class="card-header">
        <i class="fas fa-edit me-1"></i>
        <span id="formTitle">Добавить связь товар–поставщик</span>
      </div>
      <div class="card-body">
        <form th:action="@{/supply/psuppliers/save}" th:object="${productSupplier}" method="post" id="entityForm">
          <input type="hidden" id="fieldProductIdHidden" th:value="*{id != null ? id.productId : ''}">
          <input type="hidden" id="fieldSupplierIdHidden" th:value="*{id != null ? id.supplierId : ''}">

          <div class="row mb-3">
            <div class="row mb-3">
              <th:block th:replace="~{blocks/forms :: inputField('id.productId', 'Товар (ID)', 'number')}"></th:block>
              <th:block th:replace="~{blocks/forms :: inputField('id.supplierId', 'Поставщик (ID)', 'number')}"></th:block>
              <th:block th:replace="~{blocks/forms :: inputField('deliveryDays', 'Дни доставки', 'number')}"></th:block>
            </div>
          </div>

          <div class="mt-4 mb-0">
            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
              <button type="button" class="btn btn-secondary me-md-2" onclick="clearForm()">Очистить / Отмена</button>
              <button type="submit" class="btn btn-primary" id="submitBtn">Сохранить</button>
            </div>
          </div>
        </form>
      </div>
    </div>

  </div>

  <script>
    function setVal(ids, value) {
      for (let i = 0; i < ids.length; i++) {
        let el = document.getElementById(ids[i]);
        if (el) { el.value = value; return; }
      }
    }

    function fillForm(button) {
      let productId = button.getAttribute('data-productid');
      let supplierId = button.getAttribute('data-supplierid');
      let deliveryDays = button.getAttribute('data-deliverydays');

      setVal(['fieldId.productId', 'fieldIdProductId', 'fieldProductId', 'fieldProduct.id', 'fieldProduct'], productId);
      setVal(['fieldId.supplierId', 'fieldIdSupplierId', 'fieldSupplierId', 'fieldSupplier.id', 'fieldSupplier'], supplierId);
      setVal(['fieldDeliveryDays'], deliveryDays);

      let title = 'Редактирование связи (товар: ' + productId + ', поставщик: ' + supplierId + ')';
      document.getElementById('formTitle').innerText = title;

      document.getElementById('submitBtn').innerText = 'Обновить';
      document.getElementById('submitBtn').classList.remove('btn-primary');
      document.getElementById('submitBtn').classList.add('btn-success');

      document.getElementById('entityForm').scrollIntoView({ behavior: 'smooth' });
    }

    function clearForm() {
      setVal(['fieldId.productId', 'fieldIdProductId', 'fieldProductId', 'fieldProduct.id', 'fieldProduct'], '');
      setVal(['fieldId.supplierId', 'fieldIdSupplierId', 'fieldSupplierId', 'fieldSupplier.id', 'fieldSupplier'], '');
      setVal(['fieldDeliveryDays'], '');

      document.getElementById('formTitle').innerText = 'Добавить связь товар–поставщик';

      document.getElementById('submitBtn').innerText = 'Сохранить';
      document.getElementById('submitBtn').classList.add('btn-primary');
      document.getElementById('submitBtn').classList.remove('btn-success');
    }
  </script>
</div>
</body>
</html>
