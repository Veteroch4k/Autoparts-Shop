<!DOCTYPE html>
<html lang="ru" th:replace="~{layout :: layout(~{::content})}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<div th:fragment="content">
  <div class="container-fluid px-4">

    <h1 class="mt-4">Отчеты</h1>
    <ol class="breadcrumb mb-4">
      <li class="breadcrumb-item"><a th:href="@{/}">Главная</a></li>
      <li class="breadcrumb-item active">Отчеты</li>
    </ol>

    <div class="card mb-4">
      <div class="card-header">
        <i class="fas fa-file-alt me-1"></i> Конструктор отчетов
      </div>
      <div class="card-body">

        <form method="post" th:action="@{/documents/preset}">

          <div class="mb-3">
            <label class="form-label fw-bold">Быстрые отчеты:</label><br>

            <button type="submit"  name="reportId" value="1" class="btn btn-outline-primary me-2">
              <i class="fas fa-list"></i> KPI магазина
            </button>

            <button type="submit"  name="reportId" value="2" class="btn btn-outline-success me-2">
              <i class="fas fa-chart-bar"></i> Статистика по брендам
            </button>

            <button type="submit"  name="reportId" value="3" class="btn btn-outline-danger">
              <i class="fas fa-ruble-sign"></i> История продаж
            </button>
          </div>

          <hr>

          <div class="mb-3" sec:authorize="hasRole('DIRECTOR')">
            <label class="form-label text-muted">SQL запрос (Консоль администратора):</label>
            <textarea class="form-control font-monospace"
                      name="sqlQuery"
                      rows="4"
                      th:text="${sqlQuery}"></textarea>
          </div>

          <input type="hidden" name="reportId" th:value="${currentReportId}">

          <div class="d-flex gap-2">
            <button type="submit" sec:authorize="hasRole('DIRECTOR')" th:formaction="@{/documents/manual}" class="btn btn-primary">
              <i class="fas fa-play me-1"></i> Выполнить вручную
            </button>

            <button type="submit" th:formaction="@{/documents/export}" class="btn btn-dark">
              <i class="fas fa-file-download me-1"></i> Скачать CSV
            </button>
          </div>
        </form>

        <div class="alert alert-danger mt-3" th:if="${errorMessage}">
          <i class="fas fa-exclamation-triangle"></i> <span th:text="${errorMessage}"></span>
        </div>
        <div class="alert alert-info mt-3" th:if="${message}">
          <span th:text="${message}"></span>
        </div>

      </div>
    </div>

    <div class="card mb-4" th:if="${queryResult != null}">
      <div class="card-header">
        <i class="fas fa-table me-1"></i> Результат
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table id="datatablesSimple">
            <thead class="table-dark">
            <tr>
              <th th:each="col : ${columns}" th:text="${col}"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row : ${queryResult}">
              <td th:each="col : ${columns}" th:text="${row.get(col)}"></td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</div>

</body>
</html>
